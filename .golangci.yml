# .golangci.yml - golangci-lint v1 configuration

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Code quality
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosimple

    # Style
    - gofmt
    - goimports
    - misspell
    - revive

    # Bugs
    - bodyclose
    - nilerr

    # Performance
    - prealloc

    # Complexity
    - gocyclo
    - gocognit

    # Security
    - gosec

    # Modern Go
    - noctx
    - gocritic

    # Error handling
    - errorlint

  disable:
    - depguard
    - exhaustive
    - funlen
    - wrapcheck

linters-settings:
  gocyclo:
    min-complexity: 15

  gocognit:
    min-complexity: 20

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - whyNoLint
      - hugeParam

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: redefines-builtin-id

  gosec:
    excludes:
      - G104
      - G304

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  goimports:
    local-prefixes: github.com/indrasvat/dorikin

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck

    - path: cmd/
      linters:
        - wrapcheck
