# StatefulSet without HPA - should detect replica drift normally
# Expected: replicas changes should be flagged as DRIFTED
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dorikin-garage
  labels:
    app: postgres
    team: ae86
spec:
  serviceName: postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: dorikin
        - name: POSTGRES_USER
          value: tsuchiya
        - name: POSTGRES_PASSWORD
          value: ae86tofu
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dorikin-garage
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
