# Test Scenario 3: ConfigMap with Embedded YAML
# Tests ModeUnifiedDiff for embedded configuration changes
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dorikin-garage
  labels:
    app: spring-app
    environment: staging
data:
  application.yml: |
    # Spring Boot Application Configuration
    # Environment: Staging

    spring:
      application:
        name: myapp
        version: 1.2.3

      profiles:
        active: staging

      datasource:
        url: jdbc:postgresql://db:5432/myapp
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
          minimum-idle: 5
          maximum-pool-size: 20
          idle-timeout: 30000
          pool-name: SpringBootHikariCP
          max-lifetime: 1800000
          connection-timeout: 30000

      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true
            use_sql_comments: true

      redis:
        host: redis
        port: 6379
        timeout: 2000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 2

      kafka:
        bootstrap-servers: kafka:9092
        consumer:
          group-id: myapp-consumer
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.apache.kafka.common.serialization.StringSerializer

    server:
      port: 8080
      servlet:
        context-path: /api
      compression:
        enabled: true
        mime-types: application/json,application/xml,text/html,text/plain

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
          base-path: /actuator
      endpoint:
        health:
          show-details: always
          show-components: always
      metrics:
        tags:
          application: ${spring.application.name}

    logging:
      level:
        root: INFO
        com.myapp: DEBUG
        org.springframework: INFO
        org.hibernate.SQL: DEBUG
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

    app:
      security:
        jwt:
          secret: ${JWT_SECRET}
          expiration: 3600000
        cors:
          allowed-origins:
            - http://localhost:3000
            - https://staging.myapp.com
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
          allowed-headers:
            - Authorization
            - Content-Type

      features:
        enable-new-ui: true
        enable-beta-features: false
        max-upload-size: 10MB

      cache:
        default-ttl: 300
        user-cache-ttl: 600

  logback.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property name="LOG_PATH" value="${LOG_PATH:-/var/log/myapp}"/>
      <property name="LOG_FILE" value="${LOG_FILE:-myapp}"/>

      <appender name="CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
        <encoder>
          <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n</pattern>
        </encoder>
      </appender>

      <appender name="FILE" class="ch.qos.logback.core.rolling.RollingFileAppender">
        <file>${LOG_PATH}/${LOG_FILE}.log</file>
        <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">
          <fileNamePattern>${LOG_PATH}/${LOG_FILE}.%d{yyyy-MM-dd}.%i.log.gz</fileNamePattern>
          <maxHistory>30</maxHistory>
          <totalSizeCap>3GB</totalSizeCap>
          <timeBasedFileNamingAndTriggeringPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedFNATP">
            <maxFileSize>100MB</maxFileSize>
          </timeBasedFileNamingAndTriggeringPolicy>
        </rollingPolicy>
        <encoder>
          <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n</pattern>
        </encoder>
      </appender>

      <root level="INFO">
        <appender-ref ref="CONSOLE"/>
        <appender-ref ref="FILE"/>
      </root>

      <logger name="com.myapp" level="DEBUG"/>
      <logger name="org.springframework" level="INFO"/>
    </configuration>
