# Test Scenario 4: Sidecar Injection Base
# Tests ModeStructuralAdd for injected containers
# When deployed to a namespace with Istio, a sidecar will be injected
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-test
  namespace: dorikin-garage
  labels:
    app: sidecar-test
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sidecar-test
  template:
    metadata:
      labels:
        app: sidecar-test
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sidecar-test
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: app
        image: sidecar-test:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LOG_LEVEL
          value: info
        - name: HTTP_PORT
          value: "8080"
        - name: METRICS_PORT
          value: "9090"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/app/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: sidecar-test-config
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sidecar-test
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-test
  namespace: dorikin-garage
  labels:
    app: sidecar-test
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: sidecar-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sidecar-test-config
  namespace: dorikin-garage
data:
  config.json: |
    {
      "server": {
        "host": "0.0.0.0",
        "port": 8080
      },
      "logging": {
        "level": "info",
        "format": "json"
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sidecar-test
  namespace: dorikin-garage
